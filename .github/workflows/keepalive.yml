name: Keep Supabase awake

# Free-tier Supabase projects pause after 7 days with no API activity, and
# un-pausing is a manual click in the dashboard — until someone notices, the
# landing page, the tracker and login are all down together. One real REST
# request resets that clock, so this fires a cheap one every other day.
#
# It has to be an HTTP request from outside; activity inside Postgres (pg_cron
# and friends) does not count.
#
# KNOWN LIMIT: GitHub disables scheduled workflows in a repository with no
# commits for 60 days. If this repo goes quiet for two months the ping stops
# silently — which is exactly when it is needed. An external pinger
# (cron-job.org, UptimeRobot) on the same URL has no such rule and is worth
# running alongside this one.

on:
  schedule:
    - cron: '0 6 */2 * *'   # 06:00 UTC every other day (09:00 in Kuwait)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The URL and the key are read out of the app's own client so there is
      # one source of truth and no second copy to drift. The anon key is public
      # by design — it already ships inside the built bundle — and RLS is what
      # actually protects the data.
      - name: Ping the REST API
        run: |
          set -u
          URL=$(grep -oP "(?<=const SUPABASE_URL = ')[^']+" src/supabaseClient.js || true)
          KEY=$(grep -oP "(?<=const SUPABASE_ANON_KEY = ')[^']+" src/supabaseClient.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Could not read the Supabase URL or anon key from src/supabaseClient.js"
            exit 1
          fi
          echo "Pinging $URL"
          CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY")
          echo "HTTP $CODE"
          head -c 300 /tmp/body; echo
          # A paused or broken project answers something other than 200. Fail
          # the job so GitHub's failure email doubles as the alarm.
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase did not answer 200 — the project may be paused."
            exit 1
          fi
          echo "Project is awake."
